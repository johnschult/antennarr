name: Release

# A tag named vYYYY.MM.PATCH (for example v2026.10.0) publishes the container image
# to ghcr.io and creates a GitHub release whose notes are that version's section of
# CHANGELOG.md (a tag with no section fails before anything is published). Changes to the Dockerfile or this file
# only build the image, so a broken release can't be a surprise.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
    env:
      IMAGE: ghcr.io/johnschult/antennarr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]{4}\.(0?[1-9]|1[0-2])\.[0-9]+$ ]]; then
              echo "::error::the tag must look like vYYYY.MM.PATCH (v2026.10.0), not $GITHUB_REF_NAME"
              exit 1
            fi
            # The release notes are this version's section of CHANGELOG.md. Check now,
            # before anything is published, so a forgotten entry can't ship.
            awk -v v="$version" '
              /^## / { if (found) exit; split($0, h, " "); if (h[2] == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            if [[ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]]; then
              echo "::error::CHANGELOG.md has no entry for $version; add a '## $version (date)' section and tag again"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:$version,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            version=dev
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:ci" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: steps.v.outputs.release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, for a release)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.release == 'true' }}
          tags: ${{ steps.v.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
