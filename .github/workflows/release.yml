name: Release

# A tag named vYYYY.MM.PATCH (for example v2026.10.0) publishes the container image
# to ghcr.io and creates a GitHub release whose notes are that version's section of
# CHANGELOG.md (a tag with no section fails before anything is published), with archives of the program for Linux and
# macOS attached. Changes to the Dockerfile or this file only build them, so a broken release can't be a surprise.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
    env:
      IMAGE: ghcr.io/johnschult/yagi
      # The image's name before the rename, still pushed with the same tags for a few releases so existing compose files keep updating.
      IMAGE_LEGACY: ghcr.io/johnschult/antennarr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]{4}\.(0?[1-9]|1[0-2])\.[0-9]+$ ]]; then
              echo "::error::the tag must look like vYYYY.MM.PATCH (v2026.10.0), not $GITHUB_REF_NAME"
              exit 1
            fi
            # The release notes are this version's section of CHANGELOG.md. Check now,
            # before anything is published, so a forgotten entry can't ship.
            awk -v v="$version" '
              /^## / { if (found) exit; split($0, h, " "); if (h[2] == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            if [[ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]]; then
              echo "::error::CHANGELOG.md has no entry for $version; add a '## $version (date)' section and tag again"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:$version,$IMAGE:latest,$IMAGE_LEGACY:$version,$IMAGE_LEGACY:latest" >> "$GITHUB_OUTPUT"
            echo "tags_tailscale=$IMAGE:$version-tailscale,$IMAGE:tailscale" >> "$GITHUB_OUTPUT"
          else
            version=dev
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:ci" >> "$GITHUB_OUTPUT"
            echo "tags_tailscale=$IMAGE:ci-tailscale" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: steps.v.outputs.release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, for a release)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.release == 'true' }}
          tags: ${{ steps.v.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same program with the built-in Tailscale node (see docs/tailscale.md). A separate image so the plain one
      # stays free of that code; the layers they share come from the cache.
      - name: Build the Tailscale image (and push, for a release)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.release == 'true' }}
          tags: ${{ steps.v.outputs.tags_tailscale }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            TAGS=tsnet
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tailscale
          cache-to: type=gha,mode=max,scope=tailscale

      - name: Create the GitHub release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

  # The program on its own, for people without Docker (and for the install script and the Homebrew formula): one
  # archive for each system, and a checksums.txt to check them against. Built on a pull request too, without
  # being published. It runs after the image so the release it attaches to exists.
  binaries:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the files to the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web page, which the program embeds
        run: |
          cd web
          npm ci
          npm run build
      - name: Build and pack for each system
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=dev
          if [[ "$REF" == refs/tags/v* ]]; then version="${REF_NAME#v}"; fi
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="yagi_${version}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/johnschult/yagi/internal/version.Version=$version" \
              -o "build/$name/yagi" ./cmd/yagi
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt)
      - name: Check the build for this machine runs
        run: |
          tar -xzf dist/yagi_*_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/yagi_*_linux_amd64/yagi -version
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt
