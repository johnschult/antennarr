const Sparkline = ({ data, h = 48, className }) => {
  const max = 32, w = 300;
  const pts = data.map((v, i) => [(i / (data.length - 1)) * w, h - (v / max) * (h - 4) - 2]);

  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" className={cx('w-full', className)} style={{ height: h }}>

};

const OS = { unraid: 'Unraid', debian: 'Debian / Ubuntu', rhel: 'RHEL / Fedora', synology: 'Synology' };
const TRANSPORT = { tsnet: 'Built-in Tailscale', tailscale: 'Tailscale on host', wireguard: 'WireGuard / VPN', lan: 'Same LAN' };
const MEDIA = { Plex: 'Plex', Jellyfin: 'Jellyfin', Channels: 'Channels DVR', Emby: 'Emby' };

function genCommands({ os, transport, media, legacy, settings, viewer }) {
  const addrHost = transport === 'tsnet' ? 'antennarr-steve.tail1234.ts.net' : transport === 'wireguard' ? '10.8.0.1' : transport === 'lan' ? '192.168.1.20' : '100.109.224.87';
  const port = settings.port, addr = `${addrHost}:${port}`, src = viewer.addr;
  const sharer = transport === 'tsnet'
    ? [{ c: '# Nothing to open — Antennarr is its own tailnet node.\n# Share it with the viewer: Tailscale admin → Machines → antennarr-steve → Share…', note: 'Tailnet ACLs control access; no host firewall rules needed.' }]
    : settings.sharerOs === 'rhel'
      ? [{ c: `sudo firewall-cmd --permanent --zone=public \\\n  --add-rich-rule='rule family=ipv4 source address=${src}/32 port port=${port} protocol=tcp accept'\nsudo firewall-cmd --reload`, note: '--permanent survives reboots.' }]
      : [{ c: `sudo ufw allow from ${src} to any port ${port} proto tcp`, note: 'ufw rules persist automatically.' }];
  const viewerCmds = [];
  if (transport === 'tailscale') viewerCmds.push({ c: `tailscale status | grep homelab   # sharer should be listed\ntailscale ping 100.109.224.87`, note: 'Both machines must be on the same tailnet (or the sharer node shared with you).' });
  if (transport === 'tsnet') viewerCmds.push({ c: `tailscale ping antennarr-steve`, note: 'Accept the shared node in your Tailscale admin first.' });
  if (transport === 'wireguard') viewerCmds.push({ c: `# In your WireGuard peer config for the sharer, make sure:\nAllowedIPs = 10.8.0.1/32\nsudo wg show`, note: 'Only the Antennarr address needs routing — not the sharer\'s whole LAN.' });
  if (transport === 'lan') viewerCmds.push({ c: `# No routing needed.`, note: '' });
  if (legacy) {
    const rules = `TUNER=192.168.1.132; RELAY=${addrHost}
for p in 80 5004; do
  iptables -t nat -C PREROUTING -d $TUNER -p tcp --dport $p -j DNAT --to-destination $RELAY:${port} 2>/dev/null || \\
  iptables -t nat -I PREROUTING -d $TUNER -p tcp --dport $p -j DNAT --to-destination $RELAY:${port}
  iptables -t nat -C OUTPUT -d $TUNER -p tcp --dport $p -j DNAT --to-destination $RELAY:${port} 2>/dev/null || \\
  iptables -t nat -I OUTPUT -d $TUNER -p tcp --dport $p -j DNAT --to-destination $RELAY:${port}
done
iptables -t nat -C POSTROUTING -d $RELAY -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -d $RELAY -j MASQUERADE`;
    const persist = { unraid: 'Save as User Script "antennarr-dnat", schedule: At Startup of Array (and Custom */5 to self-heal).', debian: 'sudo apt install iptables-persistent && sudo netfilter-persistent save', rhel: 'Save as /usr/local/sbin/antennarr-dnat.sh + a oneshot systemd unit (After=network-online.target).', synology: 'Control Panel → Task Scheduler → Triggered Task (Boot-up, root) → paste the script.' }[os];
    viewerCmds.push({ c: rules, note: `Legacy only: your DVR still points at the tuner's LAN IP. Persist: ${persist}`, warn: true });
  }
  const mediaSteps = {
    Plex: `Settings → Live TV & DVR → Set Up Plex DVR →\n"Don't see your HDHomeRun device? Enter its network address manually" → ${addr}`,
    Jellyfin: `Dashboard → Live TV → Tuner Devices → + → HDHomeRun → URL: http://${addr}`,
    Channels: `Settings → Sources → Add Source → HDHomeRun → Manual: http://${addr}`,
    Emby: `Settings → Live TV → Add TV Source → HDHomeRun → http://${addr}`,
  }[media];
  const verify = [{ c: `curl -s http://${addr}/discover.json | jq '{FriendlyName, TunerCount, BaseURL}'`, out: `{\n  "FriendlyName": "Steve's FLEX 4K (via Antennarr)",\n  "TunerCount": ${viewer.limit},\n  "BaseURL": "http://${addr}"\n}` },
    { c: `curl -s http://${addr}/auto/v5.1 --max-time 5 -o /dev/null -w '%{http_code} %{size_download}\\n'`, out: `200 9384012` }];
  const rollback = [
    transport === 'tsnet' ? { c: '# Tailscale admin → Machines → antennarr-steve → Sharing → Revoke' } : settings.sharerOs === 'rhel'
      ? { c: `sudo firewall-cmd --permanent --zone=public \\\n  --remove-rich-rule='rule family=ipv4 source address=${src}/32 port port=${port} protocol=tcp accept'\nsudo firewall-cmd --reload` } : { c: `sudo ufw delete allow from ${src} to any port ${port} proto tcp` },
    ...(legacy ? [{ c: `for p in 80 5004; do\n  iptables -t nat -D PREROUTING -d 192.168.1.132 -p tcp --dport $p -j DNAT --to-destination ${addrHost}:${port}\n  iptables -t nat -D OUTPUT -d 192.168.1.132 -p tcp --dport $p -j DNAT --to-destination ${addrHost}:${port}\ndone\niptables -t nat -D POSTROUTING -d ${addrHost} -j MASQUERADE` }] : []),
  ];
  return { sharer, viewer: viewerCmds, media: mediaSteps, verify, rollback, addr };
}

function CodeBlock({ code, note, warn, out }) {
  const [copied, setCopied] = useState(false);
  return (
    <div className={cx('rounded-lg border overflow-hidden', warn ? 'border-amber-500/30' : 'border-zinc-800')}>
      <div className="relative bg-zinc-950">
        <pre className="font-mono text-[12.5px] leading-relaxed text-zinc-200 p-4 pr-20 overflow-x-auto whitespace-pre">{code}</pre>
        <Button size="sm" variant="outline" className="absolute top-2.5 right-2.5 bg-zinc-900" onClick={() => { navigator.clipboard?.writeText(code); setCopied(true); setTimeout(() => setCopied(false), 1400); }}>
          <Icon name={copied ? 'check' : 'copy'} className="h-3.5 w-3.5" />{copied ? 'Copied' : 'Copy'}
        </Button>
      </div>
      {out && <div className="border-t border-zinc-800 bg-zinc-900/60 px-4 py-2.5"><div className="text-[11px] uppercase tracking-wide text-zinc-500 mb-1">Expected output</div><pre className="font-mono text-xs text-emerald-300/90 whitespace-pre">{out}</pre></div>}
      {note && <div className={cx('px-4 py-2 text-xs border-t', warn ? 'bg-amber-500/5 text-amber-300/90 border-amber-500/20' : 'bg-zinc-900/60 text-zinc-400 border-zinc-800')}>{note}</div>}
    </div>
  );
}

    ))}
  </div>
);

  const [media, setMedia] = useState('Plex');
  const [legacy, setLegacy] = useState(false);
  const [tab, setTab] = useState('sharer');
  const [connected, setConnected] = useState(false);
  const viewer = VIEWERS.find((v) => v.id === viewerId);
  const cmds = genCommands({ os, transport, media, legacy, settings, viewer });
  const tabs = { sharer: 'Your server', viewer: `${viewer.name}'s server`, media: MEDIA[media], verify: 'Verify', rollback: 'Rollback' };
  return (
    <div className="space-y-4">
      <PageTitle title="Setup guide" desc="Copy-paste commands tailored to each viewer. Antennarr never runs anything on their machine." />
      <div className="grid grid-cols-1 xl:grid-cols-[360px_1fr] gap-4">
        <Card className="p-5 space-y-5 h-fit">
          <Field label="Viewer"><select value={viewerId} onChange={(e) => { setViewerId(e.target.value); setConnected(false); }} className="w-full h-9 rounded-md bg-zinc-950 border border-zinc-800 px-2 text-sm">{VIEWERS.map((v) => <option key={v.id} value={v.id}>{v.name} — {v.server}</option>)}</select></Field>
          <Field label="Their server OS"><Seg value={os} onChange={setOs} options={OS} /></Field>
          <Field label="How they'll connect"><Seg value={transport} onChange={setTransport} options={TRANSPORT} /></Field>

          <div className="flex items-center justify-between mb-2"><h2 className="text-sm font-semibold">Capacity</h2><span className="text-xs text-zinc-500">{TUNER.name} · {TUNER.tuners} tuners</span></div>
          <div className="flex h-14 rounded-xl overflow-hidden border border-zinc-800">
            {SLOTS.map((s) => { const m = slotMeta(s); return <div key={s.n} className={cx('flex-1 flex items-center justify-center text-xs font-medium border-r border-zinc-950 last:border-0', s.owner === 'local' ? 'bg-violet-500/25 text-violet-200' : s.owner === 'reserved' ? 'bg-[repeating-linear-gradient(45deg,#18181b_0,#18181b_6px,#27272a_6px,#27272a_12px)] text-zinc-400' : s.owner ? 'bg-cyan-500/25 text-cyan-100' : 'bg-zinc-900 text-zinc-500')}>{m.label}{s.ch && <span className="ml-1.5 opacity-70">· {s.ch.num}</span>}</div>; })}
          </div>
          <div className="flex gap-4 mt-2 text-xs text-zinc-500"><span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm bg-cyan-500/60" />remote</span><span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm bg-violet-500/60" />local (status.json)</span><span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm bg-zinc-600" />owner reserve ({settings.reserve})</span></div>
        </div>
        <div>
          <h2 className="text-sm font-semibold mb-2">Viewers</h2>
          <div className="grid sm:grid-cols-3 gap-3">
            {VIEWERS.map((x) => (
              <button key={x.id} onClick={() => setSel(x.id)} className={cx('text-left rounded-xl border p-4 transition-colors', sel === x.id ? 'border-cyan-400/50 bg-cyan-400/5' : 'border-zinc-800 hover:bg-zinc-900')}>
                <div className="flex items-center gap-2.5"><Avatar name={x.name} /><div className="min-w-0"><div className="font-medium text-sm truncate">{x.name}</div><div className="text-xs text-zinc-500">{x.media}</div></div>{x.status === 'connected' && <span className="ml-auto"><Dot live /></span>}</div>
                <div className="mt-4 flex items-end justify-between"><span className="text-2xl font-semibold tabular-nums">{x.inUse}<span className="text-sm text-zinc-500">/{x.limit}</span></span><span className="text-xs text-zinc-500">{x.gbToday} GB today</span></div>
              </button>
            ))}
          </div>
        </div>
        <Card><CardHead title="Bandwidth" desc="Remote upload, last 24h" /><div className="px-5 pb-5"><Sparkline data={BW} h={90} /></div></Card>
      </div>
      <aside className="space-y-4">
        <Card className="p-5">
          <div className="flex items-center gap-3"><Avatar name={v.name} size="h-11 w-11" /><div><div className="font-semibold">{v.name}</div><div className="text-xs text-zinc-500">{v.server} · {v.media}</div></div>{v.plex && <span className="ml-auto"><Badge tone="orange">Plex-linked</Badge></span>}</div>
          <dl className="mt-5 grid grid-cols-2 gap-y-3 text-sm">
            <dt className="text-zinc-500">Address</dt><dd className="font-mono text-xs text-right">{v.addr}</dd>
            <dt className="text-zinc-500">Via</dt><dd className="text-right">{v.via}</dd>
            <dt className="text-zinc-500">Tuner limit</dt><dd className="text-right">{v.limit}</dd>
            <dt className="text-zinc-500">Last seen</dt><dd className="text-right">{v.lastSeen}</dd>
          </dl>
          <div className="mt-5 flex gap-2"><Button variant="outline" size="sm" className="flex-1" onClick={() => go('setup')}>Setup guide</Button><Button variant="outline" size="sm" className="flex-1">Edit limits</Button></div>
        </Card>
        <Card>
          <CardHead title="Event log" />
          <div className="px-5 pb-5 font-mono text-[12px] space-y-2">{ALERTS.map((a, i) => <div key={i} className="flex gap-3"><span className="text-zinc-600 w-12 shrink-0">{a.t}</span><span className={{ ok: 'text-emerald-300', warn: 'text-amber-300', info: 'text-cyan-300', err: 'text-red-300' }[a.kind]}>{a.text}</span></div>)}</div>
        </Card>
      </aside>
    </div>
  );
}

/* ───────────────────────── switcher + app ───────────────────────── */
const VARIANTS = [['A', 'Sidebar app (Tracearr-like)', VariantA], ['B', 'Control room', VariantB], ['C', 'Viewer-centric split', VariantC]];
const getParam = (k, d) => new URLSearchParams(location.search).get(k) || d;
function setParam(k, v) { const p = new URLSearchParams(location.search); p.set(k, v); history.replaceState(null, '', '?' + p.toString()); }

function PrototypeSwitcher({ current, onChange }) {
  const idx = VARIANTS.findIndex((v) => v[0] === current);
  const step = (d) => onChange(VARIANTS[(idx + d + VARIANTS.length) % VARIANTS.length][0]);
  useEffect(() => {
    const h = (e) => { if (e.target.closest('input,textarea,select,[contenteditable]')) return; if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });
  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1 rounded-full bg-fuchsia-600 text-white shadow-2xl shadow-fuchsia-900/50 px-1.5 py-1.5 text-sm font-medium">
      <button onClick={() => step(-1)} className="h-8 w-8 rounded-full hover:bg-white/15 grid place-items-center"><Icon name="chevL" /></button>
      <span className="px-2 min-w-56 text-center">PROTOTYPE · {current} ({VARIANTS[idx][1]})</span>
      <button onClick={() => step(1)} className="h-8 w-8 rounded-full hover:bg-white/15 grid place-items-center"><Icon name="chevR" /></button>
    </div>
  );
}

function App() {
  const [variant, setVariant] = useState(getParam('variant', 'A'));
  const [page, setPage] = useState(getParam('page', 'dashboard'));
  const [settings, setSettings] = useState(SETTINGS_DEFAULT);
  const go = (p) => { setPage(p); setParam('page', p); window.scrollTo(0, 0); };
  const change = (v) => { setVariant(v); setParam('variant', v); };
  const V = (VARIANTS.find((x) => x[0] === variant) || VARIANTS[0])[2];
  return <><V page={page} go={go} settings={settings} setSettings={setSettings} /><PrototypeSwitcher current={variant} onChange={change} /></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
